[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcite"
version = "0.2.0"
description = "找出 AI 生成报告里的假引用：不存在的来源、打不开的链接、原文里根本没有的数字"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DIUDIU1HAO" }]
keywords = ["citation", "hallucination", "llm", "fact-check", "research", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
deadcite = "deadcite.cli:main"

[project.urls]
Homepage = "https://github.com/DIUDIU1HAO/deadcite"

[tool.setuptools]
packages = ["deadcite"]

[tool.setuptools.package-data]
deadcite = ["py.typed"]
