[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcite"
version = "0.1.0"
description = "找出 AI 生成报告里的假引用：不存在的来源、打不开的链接、原文里根本没有的数字"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DIUDIU1HAO" }]
keywords = ["citation", "hallucination", "llm", "fact-check", "research", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
deadcite = "deadcite.cli:main"

[project.urls]
Homepage = "https://github.com/DIUDIU1HAO/deadcite"

[tool.setuptools]
packages = ["deadcite"]
